name: live_location_share
description: "Live Location Share - A permission-based live location sharing app built with Flutter and Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.5
  firebase_database: ^10.5.5

  # Location & Permissions
  geolocator: ^11.0.0
  permission_handler: ^11.3.1

  # Background Service & Notifications
  flutter_background_service: ^3.5.0
  flutter_local_notifications: ^17.1.2
  shared_preferences: ^2.2.3

  # Networking
  connectivity_plus: ^6.0.3

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
